<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songs for you</title>
<style>
  :root{
    --cream:#eee2cd;
    --paper:#fbf3e0;
    --sage:#a7b293;
    --sage-dark:#6f7c5f;
    --rose:#e9a9b4;
    --rose-deep:#b8566b;
    --ink:#2c2420;
    --note:#f7e2a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Sarabun","Noto Serif Thai",serif;
    color:var(--ink);
    background:var(--cream);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}

  /* ---------- Stage 1 : envelope ---------- */
  #intro{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%,#f5ebd9 0%,var(--cream) 70%);
    z-index:3;
    transition:opacity 1s ease;
  }
  .env-btn{perspective:900px;display:block;padding:12px}
  .env{position:relative;width:min(62vw,260px);aspect-ratio:3/2;transition:transform .5s ease}
  .env-btn:hover .env{transform:translateY(-4px) rotate(-1deg)}
  .env .back,.env .front-l,.env .front-r,.env .front-b,.env .flap{position:absolute;inset:0}
  .env .back{background:#d9bf92;border-radius:4px;box-shadow:0 14px 30px rgba(90,60,30,.22)}
  .env .letter{
    position:absolute;left:8%;right:8%;top:10%;height:80%;background:var(--paper);border-radius:3px;
    transition:transform .8s .35s cubic-bezier(.3,.8,.3,1);
  }
  .env .front-l{background:#e8cfa0;clip-path:polygon(0 0,52% 52%,0 100%)}
  .env .front-r{background:#e4c999;clip-path:polygon(100% 0,48% 52%,100% 100%)}
  .env .front-b{background:#ecd5a8;clip-path:polygon(0 100%,50% 48%,100% 100%)}
  .env .flap{
    background:#efdbb2;clip-path:polygon(0 0,100% 0,50% 58%);
    transform-origin:top center;transition:transform .7s ease, z-index 0s .35s;z-index:3;
  }
  .env .seal{
    position:absolute;left:50%;top:50%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#a487b8,#6d4f86);
    box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:4;transition:opacity .3s;
  }
  .env.open .flap{transform:rotateX(180deg);z-index:0}
  .env.open .seal{opacity:0}
  .env.open .letter{transform:translateY(-38%)}
  .hint{
    margin-top:34px;font-style:italic;font-size:1.05rem;color:#8a3d4f;letter-spacing:.02em;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{opacity:.35}}

  /* ---------- Bloom transition ---------- */
  #bloom{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:1;transition:opacity 1.2s ease}
  #bloom.gone{opacity:0}
  #bloom .fl{position:absolute;transform:scale(0) rotate(-40deg);transition:transform 1.1s cubic-bezier(.2,.9,.25,1.15)}
  #bloom.go .fl{transform:scale(1) rotate(var(--r))}

  /* ---------- Stage 2 : mixtape ---------- */
  #gift{
    position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;justify-content:center;
    padding:24px 14px 40px;
    background:
      radial-gradient(ellipse at 15% 30%,rgba(255,236,232,.9),transparent 55%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 22px,rgba(214,150,160,.10) 22px 46px),
      linear-gradient(180deg,#efc4c4,#e3a5ad);
    opacity:0;visibility:hidden;transition:opacity 1.2s ease;
  }
  #gift.show{opacity:1;visibility:visible}
  .sheet{
    width:min(100%,560px);margin:auto;background:var(--paper);border-radius:6px;
    padding:28px 26px 30px;position:relative;
    box-shadow:0 30px 60px rgba(120,50,70,.28),0 2px 0 rgba(255,255,255,.7) inset;
    background-image:repeating-linear-gradient(0deg,rgba(150,120,70,.035) 0 1px,transparent 1px 3px);
  }
  .to{font-size:.78rem;color:#6b5a4c;letter-spacing:.04em}
  h1{font-weight:400;font-size:clamp(2rem,8vw,2.7rem);line-height:1.1;margin:6px 0 18px;letter-spacing:-.01em}

  .tape{width:100%;display:block;filter:drop-shadow(0 12px 14px rgba(20,30,70,.4))}

  .lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;align-items:start}
  .tracks{list-style:none}
  .track{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(60,40,30,.15)}
  .track:last-child{border-bottom:0}
  .track .meta{flex:1;min-width:0}
  .track .t{font-weight:700;font-size:.92rem}
  .track .a{font-size:.8rem;color:#6b5a4c}
  .pbtn{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;
    transition:background .2s,color .2s;flex:none;
  }
  .pbtn svg{width:12px;height:12px;fill:currentColor}
  .pbtn.on{background:#26335f;color:#fff;border-color:#26335f}
  .nowp{font-size:.78rem;color:#6b5a4c;margin-top:10px}

  .liner{
    position:relative;transform:rotate(1.2deg);
    filter:drop-shadow(0 8px 10px rgba(120,90,20,.28));
    font-size:.95rem;line-height:1.55;
    font-family:"Bradley Hand","Segoe Print","Noto Sans Thai Looped","Sarabun",cursive;
  }
  .liner .paper{
    background:
      radial-gradient(circle at 12% 18%,rgba(190,150,70,.16) 0 18%,transparent 40%),
      radial-gradient(circle at 88% 85%,rgba(190,150,70,.18) 0 15%,transparent 38%),
      var(--note);
    padding:24px 16px 28px;
    clip-path:polygon(
      0 2.2%,5% .6%,11% 2.6%,18% .8%,26% 2.4%,34% .3%,43% 2.1%,52% .7%,61% 2.5%,70% .5%,79% 2.2%,88% .4%,95% 2.3%,100% .9%,
      99.2% 12%,100% 24%,99% 37%,100% 52%,99.3% 66%,100% 80%,99% 91%,
      100% 97%,94% 99.2%,87% 96.6%,79% 99.4%,70% 97%,61% 99.6%,52% 96.9%,43% 99.2%,34% 97.1%,25% 99.5%,16% 96.8%,8% 99.1%,0 97.6%,
      1% 88%,0 74%,1.1% 60%,0 46%,.9% 31%,0 17%);
  }
  .liner::before{
    content:"";position:absolute;top:-9px;left:50%;width:64px;height:20px;margin-left:-32px;
    background:rgba(233,169,180,.75);transform:rotate(-4deg);z-index:2;
    clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 50%,100% 100%,10% 100%,6% 88%,3% 100%,0 90%,3% 50%);
  }
  .liner .lbl{font-family:inherit;font-size:.7rem;color:#8a7440;margin-bottom:6px}
  .liner p{white-space:pre-line}

  .wishrow{margin-top:22px;text-align:center}
  .wishbtn{
    background:var(--rose-deep);color:#fff;padding:12px 22px;border-radius:999px;font-size:.95rem;
    box-shadow:0 8px 18px rgba(184,86,107,.35);transition:transform .15s;
  }
  .wishbtn:active{transform:scale(.96)}
  .wishtxt{margin-top:12px;font-style:italic;color:#8a3d4f;min-height:1.4em}
  #ytwrap{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
  .caret::after{content:"|";margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:520px){
    .lower{grid-template-columns:1fr}
    .sheet{padding:22px 18px 26px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>

<!-- STAGE 1 -->
<section id="intro">
  <button class="env-btn" id="openBtn" aria-label="Tap to open">
    <div class="env" id="env">
      <div class="back"></div>
      <div class="letter"></div>
      <div class="front-l"></div><div class="front-r"></div><div class="front-b"></div>
      <div class="flap"></div>
      <div class="seal"></div>
    </div>
  </button>
  <p class="hint" id="hint">Tap to open</p>
</section>

<div id="bloom" aria-hidden="true"></div>

<!-- STAGE 2 -->
<main id="gift">
  <article class="sheet" id="sheet">
    <p class="to" id="toLine"></p>
    <h1 id="title"></h1>

    <svg class="tape" viewBox="0 0 400 260" role="img" aria-label="Cassette tape">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a5b94"/><stop offset="1" stop-color="#2b3868"/>
        </linearGradient>
        <g id="leaf"><path d="M0 0C6-10 6-22 0-32C-6-22-6-10 0 0Z" fill="#b9c4ea" opacity=".8"/></g>
        <g id="sprig">
          <path d="M0 0V-46" stroke="#b9c4ea" stroke-width="1.6" fill="none"/>
          <use href="#leaf" transform="translate(0,-10) rotate(-50) scale(.7)"/>
          <use href="#leaf" transform="translate(0,-10) rotate(50) scale(.7)"/>
          <use href="#leaf" transform="translate(0,-24) rotate(-45) scale(.7)"/>
          <use href="#leaf" transform="translate(0,-24) rotate(45) scale(.7)"/>
          <use href="#leaf" transform="translate(0,-46) scale(.7)"/>
        </g>
        <g id="screw"><circle r="6" fill="#8a7a55"/><path d="M-4-4L4 4M4-4L-4 4" stroke="#4d412a" stroke-width="1.4"/></g>
      </defs>
      <rect x="10" y="14" width="380" height="236" rx="16" fill="url(#g)" stroke="#1d2850" stroke-width="2"/>
      <rect x="22" y="26" width="356" height="148" rx="10" fill="#6577b0" opacity=".45"/>
      <!-- sprigs -->
      <use href="#sprig" transform="translate(48,140)"/><use href="#sprig" transform="translate(88,150) scale(.85)"/>
      <use href="#sprig" transform="translate(352,140)"/><use href="#sprig" transform="translate(312,150) scale(.85)"/>
      <use href="#sprig" transform="translate(130,60) scale(.7) rotate(-10)"/><use href="#sprig" transform="translate(270,60) scale(.7) rotate(10)"/>
      <!-- label -->
      <rect x="96" y="38" width="208" height="28" rx="14" fill="#f5efdc" opacity=".92"/>
      <text id="tapeLabel" x="200" y="57" text-anchor="middle" font-size="15" font-style="italic" fill="#4a4034" font-family="Georgia,serif"></text>
      <!-- window -->
      <rect x="100" y="76" width="200" height="66" rx="30" fill="#2a2420"/>
      <rect x="168" y="88" width="64" height="42" rx="6" fill="#4b3a33"/>
      <g class="reel" id="reelL"><circle cx="138" cy="109" r="26" fill="#d9d6c3" stroke="#1d2850" stroke-width="3"/>
        <circle cx="138" cy="109" r="9" fill="#2a2420"/>
        <path d="M138 83V135M112 109H164M120 91L156 127M156 91L120 127" stroke="#bdb9a3" stroke-width="3"/></g>
      <g class="reel" id="reelR"><circle cx="262" cy="109" r="26" fill="#d9d6c3" stroke="#1d2850" stroke-width="3"/>
        <circle cx="262" cy="109" r="9" fill="#2a2420"/>
        <path d="M262 83V135M236 109H288M244 91L280 127M280 91L244 127" stroke="#bdb9a3" stroke-width="3"/></g>
      <!-- bottom -->
      <path d="M70 250 L90 182 H310 L330 250Z" fill="#33407a" stroke="#1d2850" stroke-width="2"/>
      <circle cx="140" cy="225" r="7" fill="#141c3a"/><circle cx="260" cy="225" r="7" fill="#141c3a"/>
      <rect x="176" y="218" width="12" height="14" rx="2" fill="#8a9bd0"/><rect x="212" y="218" width="12" height="14" rx="2" fill="#8a9bd0"/>
      <use href="#screw" transform="translate(32,34)"/><use href="#screw" transform="translate(368,34)"/>
      <use href="#screw" transform="translate(32,230)"/><use href="#screw" transform="translate(368,230)"/>
      <use href="#screw" transform="translate(200,198)"/>
      <!-- charms -->
      <circle cx="116" cy="168" r="9" fill="#e7c9a0"/><circle cx="116" cy="168" r="4" fill="#e0a24a"/>
      <circle cx="148" cy="172" r="11" fill="#e9b88a"/><circle cx="148" cy="172" r="5" fill="#d98a52"/>
      <g transform="translate(184,172)"><path d="M0 0L-14-9V9ZM0 0L14-9V9Z" fill="#c25b6a"/><circle r="4" fill="#9c3a4a"/></g>
    </svg>

    <div class="lower">
      <div>
        <ul class="tracks" id="tracks"></ul>
        <p class="nowp" id="nowp"></p>
      </div>
      <aside class="liner">
        <div class="paper">
          <p class="lbl">Liner note</p>
          <p id="note" aria-live="polite"></p>
        </div>
      </aside>
    </div>
    <div class="wishrow">
      <button class="wishbtn" id="wishBtn">🎂 อธิษฐานก่อนเป่าเค้ก</button>
      <p class="wishtxt" id="wishTxt"></p>
    </div>
  </article>
</main>
<div id="ytwrap" aria-hidden="true"><div id="ytbox"></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ============================================================
   แก้ตรงนี้ได้เลย / EDIT HERE
   - to / from : ชื่อผู้รับและผู้ส่ง
   - tracks    : รายชื่อเพลง ใส่ src เป็นลิงก์ไฟล์เสียง (.mp3) ถ้ามี
                 ถ้าไม่ใส่ src ปุ่มจะหมุนเทปให้ แต่ไม่มีเสียง
   - note      : ข้อความถึงเขา (ขึ้นบรรทัดใหม่ด้วย \n)
   ============================================================ */
const CONFIG = {
  to: "Aitim",
  from: "",                       // ใส่ชื่อเล่นของคุณ หรือเว้นว่างไว้
  title: "Happy Birthday, Aitim",
  tapeLabel: "Happy Birthday Aitim",
  // src = ชื่อไฟล์เพลง .mp3 ที่วางไว้โฟลเดอร์เดียวกับไฟล์นี้ (ตั้งชื่อเป็นภาษาอังกฤษ ไม่มีเว้นวรรค)
  // ถ้ารู้ชื่อเพลงจริง แก้ title / artist ตรงนี้ได้เลย
  tracks: [
    { title: "Get You", artist: "Daniel Caesar ft. Kali Uchis", src: "song1.mp3" },
    { title: "Japanese Denim", artist: "Daniel Caesar", src: "song2.mp3" }
  ],
  note: "สุขสันต์วันเกิดนะ 🤍\nขอบคุณที่อยู่ข้างกันมาตลอด\nปีนี้ขอให้อัยมีความสุขทุกวัน\nแล้วเรายังอยู่รักกันไปเรื่อย",
  wish: "ขอให้ทุกคำอธิษฐานของ Aitim เป็นจริงนะ"
};

/* ---------- fill content ---------- */
const $ = id => document.getElementById(id);
$("toLine").textContent = CONFIG.from ? `ถึง ${CONFIG.to}, จาก ${CONFIG.from}` : `ถึง ${CONFIG.to}`;
$("title").textContent = CONFIG.title;
$("tapeLabel").textContent = CONFIG.tapeLabel;

/* ---------- tracks / audio ---------- */
const playIcon = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
let current = -1, audio = null;
const list = $("tracks");

CONFIG.tracks.forEach((t, i) => {
  const li = document.createElement("li");
  li.className = "track";
  li.innerHTML = `<div class="meta"><div class="t"></div><div class="a"></div></div>
    <button class="pbtn" aria-label="Play ${t.title}">${playIcon}</button>`;
  li.querySelector(".t").textContent = t.title;
  li.querySelector(".a").textContent = t.artist;
  li.querySelector("button").addEventListener("click", () => toggle(i));
  list.appendChild(li);
});
$("nowp").textContent = CONFIG.tracks.length ? `Starting: ${CONFIG.tracks[0].title}` : "";

/* รอกเทปหมุนด้วย JS (ไม่พึ่ง CSS animation เพื่อให้หมุนได้ทุกเครื่อง) */
const reels = [[$("reelL"),138,109],[$("reelR"),262,109]];
let spinning = false, angle = 0, lastT = 0;
function spinLoop(t){
  if (!spinning) return;
  const dt = lastT ? Math.min(t - lastT, 50) : 16; lastT = t;
  angle = (angle + dt * 0.18) % 360;            // ~65 องศา/วินาที
  reels.forEach(([el,cx,cy]) => el.setAttribute("transform", `rotate(${angle} ${cx} ${cy})`));
  requestAnimationFrame(spinLoop);
}
function setSpin(on){
  if (on === spinning) return;
  spinning = on; lastT = 0;
  if (on) requestAnimationFrame(spinLoop);
}

function setUI(playing){
  setSpin(playing);
  $("sheet").classList.toggle("playing", playing);
  [...list.querySelectorAll(".pbtn")].forEach((b, i) => {
    const on = playing && i === current;
    b.classList.toggle("on", on);
    b.innerHTML = on ? pauseIcon : playIcon;
  });
  if (current > -1) $("nowp").textContent = (playing ? "Now playing: " : "Paused: ") + CONFIG.tracks[current].title;
}
/* ---------- YouTube (ซ่อนภาพ ใช้แค่เสียง) ---------- */
let yt = null, ytReady = false, pendingId = null;
if (CONFIG.tracks.some(t => t.yt)){
  const ytTag = document.createElement("script");
  ytTag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytTag);
}
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("ytbox", {
    width: "2", height: "2",
    playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0 },
    events: {
      onReady: () => { ytReady = true; if (pendingId){ yt.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: e => {
        if (current < 0 || !CONFIG.tracks[current].yt) return;
        if (e.data === 1) setUI(true);                    // กำลังเล่น
        else if (e.data === 2) setUI(false);              // หยุดชั่วคราว
        else if (e.data === 0){                           // จบเพลง
          if (current + 1 < CONFIG.tracks.length) toggle(current + 1); else setUI(false);
        }
      },
      onError: () => { setUI(false); $("nowp").textContent = "เพลงนี้เล่นผ่านหน้าเว็บไม่ได้ ลองเปลี่ยนคลิปดูนะ"; }
    }
  });
};
function playYT(id){
  if (ytReady) yt.loadVideoById(id); else pendingId = id;
}

function toggle(i){
  const t = CONFIG.tracks[i];
  if (current === i){                       // เพลงเดิม: หยุด / เล่นต่อ
    const playing = $("sheet").classList.contains("playing");
    if (t.yt){
      if (ytReady) playing ? yt.pauseVideo() : yt.playVideo();
    } else {
      if (audio) playing ? audio.pause() : audio.play();
      setUI(!playing);
    }
    return;
  }
  if (audio){ audio.pause(); audio = null; }
  if (ytReady && yt && yt.pauseVideo && CONFIG.tracks[current] && CONFIG.tracks[current].yt) yt.pauseVideo();
  current = i;
  if (t.yt){
    playYT(t.yt);
    setUI(false);
    $("nowp").textContent = "กำลังโหลด: " + t.title;
  } else {
    if (t.src){
      audio = new Audio(t.src);
      audio.addEventListener("error", () => { setUI(false); $("nowp").textContent = "หาไฟล์เพลงไม่เจอ ตรวจชื่อไฟล์อีกครั้งนะ"; });
      audio.addEventListener("ended", () => {
        if (i + 1 < CONFIG.tracks.length) toggle(i + 1); else setUI(false);
      });
      audio.play().catch(() => setUI(false));
    }
    setUI(true);
  }
}

/* ---------- flowers ---------- */
function flowerSVG(){
  const palette = ["#f1a9b8","#f6c2cb","#e98aa0","#fbd9d6","#fff0e0","#f4b6a8","#d96f8a"];
  const c = palette[Math.floor(Math.random()*palette.length)];
  const c2 = palette[Math.floor(Math.random()*palette.length)];
  const n = 6 + Math.floor(Math.random()*4);
  let p = "";
  for (let k = 0; k < n; k++){
    p += `<ellipse cx="0" cy="-22" rx="13" ry="22" fill="${c}" opacity=".95" transform="rotate(${k*360/n})"/>`;
  }
  for (let k = 0; k < n; k++){
    p += `<ellipse cx="0" cy="-12" rx="8" ry="13" fill="${c2}" opacity=".9" transform="rotate(${k*360/n+180/n})"/>`;
  }
  p += `<circle r="6" fill="#f3d27a"/>`;
  return `<svg viewBox="-50 -50 100 100" width="100%" height="100%">${p}</svg>`;
}
function bloom(){
  const box = $("bloom");
  const W = innerWidth, H = innerHeight, cx = W/2, cy = H/2;
  const step = Math.max(70, Math.min(W, H) / 5);
  for (let y = -step/2; y < H + step; y += step*.72){
    for (let x = -step/2; x < W + step; x += step*.72){
      const s = step * (1.1 + Math.random()*.7);
      const px = x + (Math.random()-.5)*step*.4, py = y + (Math.random()-.5)*step*.4;
      const d = Math.hypot(px - cx, py - cy) / Math.hypot(cx, cy);
      const el = document.createElement("div");
      el.className = "fl";
      el.style.cssText = `left:${px - s/2}px;top:${py - s/2}px;width:${s}px;height:${s}px;--r:${Math.random()*80-40}deg;transition-delay:${d*0.9}s`;
      el.innerHTML = flowerSVG();
      box.appendChild(el);
    }
  }
  // cream background so the stage under it is hidden until blooms cover it
  box.style.background = "radial-gradient(circle at 50% 50%, #f6e3df, #eec7cb)";
  requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("go")));
}

/* ---------- confetti ---------- */
const cv = $("confetti"), ctx = cv.getContext("2d");
let bits = [], raf = null;
function sizeCanvas(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function confetti(count = 140){
  const colors = ["#e9a9b4","#b8566b","#f7e2a8","#a7b293","#fff","#f1a9b8","#d9bf92"];
  const dpr = devicePixelRatio;
  for (let i = 0; i < count; i++){
    bits.push({
      x: cv.width/2 + (Math.random()-.5)*cv.width*.3, y: cv.height*.55,
      vx: (Math.random()-.5)*14*dpr, vy: (-Math.random()*16-6)*dpr,
      s: (4+Math.random()*6)*dpr, r: Math.random()*6, vr: (Math.random()-.5)*.4,
      c: colors[Math.floor(Math.random()*colors.length)], life: 0
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b => {
    b.vy += .35*devicePixelRatio; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
    ctx.fillStyle = b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore();
  });
  bits = bits.filter(b => b.y < cv.height + 40 && b.life < 260);
  raf = bits.length ? requestAnimationFrame(tick) : null;
  if (!bits.length) ctx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- typewriter note ---------- */
function typeNote(){
  const el = $("note"), chars = Array.from(CONFIG.note);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = CONFIG.note; return; }
  let i = 0; el.classList.add("caret");
  (function step(){
    el.textContent = chars.slice(0, ++i).join("");
    if (i < chars.length) setTimeout(step, chars[i-1] === "\n" ? 320 : 55);
    else el.classList.remove("caret");
  })();
}

/* ---------- wish ---------- */
$("wishBtn").addEventListener("click", () => {
  $("wishTxt").textContent = CONFIG.wish;
  confetti(180);
});

/* ---------- open sequence ---------- */
let opened = false;
$("openBtn").addEventListener("click", () => {
  if (opened) return; opened = true;
  toggle(0);   // เริ่มเพลงแรกทันทีที่แตะซอง (ต้องเริ่มตอนผู้ใช้แตะ เบราว์เซอร์ถึงยอมให้มีเสียง)
  $("env").classList.add("open");
  $("hint").style.visibility = "hidden";
  setTimeout(() => {
    bloom();
    setTimeout(() => {
      $("intro").style.display = "none";
      $("gift").classList.add("show");
      $("bloom").classList.add("gone");
      confetti(160);
      setTimeout(typeNote, 900);
      setTimeout(() => $("bloom").remove(), 1300);
    }, 3000);
  }, 1100);
});
